# Deploys the site to GitHub Pages from an Actions artifact that holds only the site's own files
# (scripts/build-site.mjs: no tests, scripts, workflows, docs or package files).
#
# Why: legacy (branch) Pages publishes the whole repo root, repo-only files included (README, tests,
# scripts, package files). Human pushes to main deploy via `push`. A GITHUB_TOKEN push (the launch-data bot in launches.yml) doesn't start this workflow,
# so launches.yml calls it after each data commit. In legacy mode the built-in branch build still publishes
# those data commits on its own; this workflow's deploy only takes over after the switch below.
#
# One-time switch (repository owner): Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Until then the "check" job sees the branch ("legacy") source and skips the deploy, so the existing
# branch deploy keeps serving the site unchanged.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# Ordering: one run at a time across every trigger (push, manual, the call from launches.yml), and each
# build checks out the current tip of main rather than the commit that triggered it. So a later deploy
# always ships an equal or newer main and an older data commit can't roll the site back. Running deploys
# are never cancelled; a waiting run is replaced by a newer one, which builds the newer main anyway.
# (Static group name, unlike launches.yml's "launch-data": a called workflow sharing its caller's group
# would deadlock.)
concurrency:
  group: pages-site
  cancel-in-progress: false
jobs:
  check:
    # Main only (build and deploy need this job). Under workflow_call, github.ref is the caller's ref, so a
    # launches.yml run on main passes; a manual run from any other branch deploys nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      source: ${{ steps.src.outputs.source }}
    steps:
      - name: Read the Pages source
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # "workflow" = GitHub Actions source, "legacy" = branch deploy, 404 = Pages not enabled.
          # Any other error fails the run loudly rather than silently skipping a deploy.
          if source=$(gh api "repos/$REPO/pages" --jq .build_type 2>err.txt); then :
          elif grep -q "HTTP 404" err.txt; then source=none
          else cat err.txt >&2; exit 1; fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          if [ "$source" != "workflow" ]; then
            echo "::notice::Pages source is '$source', not 'GitHub Actions'; skipping this deploy (the branch deploy, if any, still runs). Switch it in Settings > Pages."
          fi
  build:
    needs: check
    if: needs.check.outputs.source == 'workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main # the tip of main now, not the triggering commit (see "Ordering" above)
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Collect the site files
        run: node scripts/build-site.mjs _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
