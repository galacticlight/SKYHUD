# Refreshes data/launches.json (the Launch tracker's same-origin snapshot) from Launch Library 2.
# Visitors' browsers never call LL2: The Space Devs asks apps to cache its free API (15 calls/hour/IP).
# Each run makes 5 LL2 calls (+4 agency-list calls only when a new launch provider appears).
# A failed or incomplete fetch fails the run without writing, so the last good snapshot stays live.
# Caveats: GitHub may delay or drop scheduled runs at busy times, and disables schedules in public repos
# after 60 days without repository activity. The last job ("keep-enabled") re-enables this workflow through
# the API on every run, so a schedule that is still running stays enabled; once GitHub has disabled it, only
# a person can turn it back on (Actions tab > Update launch data > Enable workflow, or "Run workflow").
# Pushes made with GITHUB_TOKEN don't trigger a Pages build, so after a data commit the "deploy" job calls
# pages.yml to publish it (needs Settings > Pages > Source = "GitHub Actions"; skipped until then).
name: Update launch data
on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours at :17 UTC (off the busy top of the hour)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launch-data
  cancel-in-progress: false
jobs:
  update:
    # Main only: a manual run from another branch would otherwise push that branch (plus data) to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # only for the push step, the one step that is given the token
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config: the fetch script and tests run without it.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Fetch Launch Library 2 snapshot
        run: node scripts/update-launches.mjs --out data
      - name: Validate snapshot
        run: node --test tests/launchdata.test.mjs
      - name: Commit only if the data changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data scripts/launch-providers.json
          if git diff --cached --quiet; then echo "No change"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Update launch data from Launch Library 2"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push (fast-forward only)
        id: push
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The token is passed to this one git command only (not saved in .git/config) and masked in logs.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # Fast-forward only: no pull, no rebase, no force. If main moved since checkout, the push is
          # rejected and this run fails loudly; the next run starts again from a fresh checkout.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    # Publish the new data commit (a GITHUB_TOKEN push doesn't trigger Pages by itself).
    needs: update
    if: needs.update.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
  keep-enabled:
    # Runs last, even when the update failed. Its own job, so nothing else gets write access to Actions.
    needs: [update, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow (guards the 60-day inactivity auto-disable)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPO/actions/workflows/launches.yml/enable"
