<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="SKYHUD — Seattle space citizen-science HUD. ISS and satellite trajectories across the Seattle sky." />
  <title>SKYHUD · STANDBY</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="hud" id="hud">
    <div class="vignette"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="toast" id="toast" hidden>
      <span class="toast-tag">ALERT</span>
      <span id="toast-msg">—</span>
    </div>

    <header class="telemetry">
      <section class="panel left">
        <div class="label">Ops node</div>
        <div class="value">SEATTLE</div>
        <div class="value mono" id="clock">--:--:-- PDT</div>
        <div class="sub" id="date-line"></div>
        <div class="sub" id="moon-line">MOON —</div>
        <div class="sub" id="cloud-line">SKY —</div>
      </section>
      <section class="status-cluster" style="text-align:center">
        <div class="status-pill">
          <span class="dot-live"></span>
          <span>SYSTEMS ONLINE</span>
        </div>
        <div class="sub mono" id="uptime">UP 00:00:00</div>
        <div class="sub mono" id="ops-count">0 OVERHEAD</div>
        <div class="sub mono" id="track-count">COMPUTING TRACKS…</div>
      </section>
      <section class="panel-right" id="iss-panel">
        <div class="label">Next ISS pass</div>
        <div class="value mono accent" id="iss-countdown">T— --:--</div>
        <div class="sub" id="iss-when">acquiring lock…</div>
        <div class="sub" id="iss-meta"></div>
        <div class="arc-wrap"><div class="arc" id="iss-arc"></div></div>
      </section>
    </header>

    <div class="event-strip">
      <span class="pulse-dot"></span>
      <span id="event-text">scanning celestial calendar…</span>
    </div>

    <div class="stage" id="stage">
      <section class="sky-panel">
        <div class="sky-wrap" id="sky-wrap">
          <canvas class="sky-canvas" id="sky" aria-label="Seattle sky satellite map, zenith center, north up"></canvas>
        </div>
        <p class="sky-caption">SEATTLE SKY · ZENITH CENTER · N UP · EL ≥ 10° TRACKS</p>
      </section>
      <aside class="pass-panel">
        <div class="pass-head">
          <span>SEATTLE TRACKS</span>
          <span class="mono" id="tle-source">ACQUIRING</span>
        </div>
        <ul class="pass-list" id="pass-list"></ul>
      </aside>
    </div>

    <div class="missions" id="missions" hidden>
      <button class="mission" data-id="globe" type="button">
        <span class="kicker">Do now · 10 min</span>
        <span class="mission-title">Globe at Night</span>
        <span class="sub">Count stars from your block · phone · outside</span>
        <span class="st READY">READY</span>
      </button>
      <button class="mission" data-id="iss" type="button" id="iss-card">
        <span class="kicker">Catch a pass</span>
        <span class="mission-title">ISS · Video</span>
        <span class="sub" id="iss-card-sub">Next visible window over Seattle</span>
        <span class="st STANDBY" id="iss-card-status">STANDBY</span>
      </button>
      <button class="mission" data-id="sas" type="button">
        <span class="kicker">Next event</span>
        <span class="mission-title">SAS Star Party</span>
        <span class="sub">Fri Sep 11 · Duvall Big Rock Park · scopes often provided</span>
        <span class="st QUEUED">QUEUED</span>
      </button>
    </div>

    <aside class="ops-log" aria-live="polite">
      <div class="ops-head">
        <span>COMMS</span>
        <button type="button" class="ghost-btn" id="notify-btn">ENABLE ALERTS</button>
      </div>
      <ul class="log-list" id="log-list"></ul>
    </aside>

    <nav class="dock" aria-label="Filters">
      <button class="chip active" data-filter="sky" type="button">Sky</button>
      <button class="chip" data-filter="all" type="button">All</button>
      <button class="chip" data-filter="outside" type="button">Outside</button>
      <button class="chip" data-filter="events" type="button">Events</button>
    </nav>
    <button class="red-toggle" id="red-toggle" type="button" aria-pressed="false">RED</button>
  </div>

  <aside class="sheet" id="sheet" hidden>
    <div class="sheet-inner">
      <button class="ghost-btn" id="sheet-close" type="button" style="float:right">close</button>
      <p class="kicker" id="sheet-kicker"></p>
      <h2 id="sheet-title"></h2>
      <p class="sub" id="sheet-body" style="line-height:1.45"></p>
      <a class="go" id="sheet-link" href="#" target="_blank" rel="noopener">Open official project</a>
    </div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/satellite.js@5/dist/satellite.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
